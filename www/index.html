<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0b0b14">
    <title>D.Fabrik</title>
    <link rel="stylesheet" href="css/fontawesome/all.min.css">
    <link rel="stylesheet" href="css/fonts.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app" id="app">
<!-- TOPBAR -->
<div class="topbar">
    <button class="tb" id="menuBtn"><i class="fas fa-bars"></i></button>
    <div style="display:flex; align-items:center; gap:8px;">
        <button class="tb av-top" onclick="window.goTo('perfil')"><div class="av" style="width:38px;height:38px;font-size:15px;border:none;background:linear-gradient(135deg,var(--blue),var(--purple))">A</div></button>
        <button class="tb" id="syncIndicator" title="Estado de sincronización" style="position:relative;">
          <i class="fas fa-cloud" id="syncIcon"></i>
          <span id="syncDot"></span>
        </button>
        <button class="tb" id="notifBtn"><i class="fas fa-bell"></i><span class="nd"></span></button>
    </div>
</div>

    <!-- CONTENEDOR DE VISTAS -->
    <div class="view-container" id="view-container"></div>

    <!-- BOTÓN FLOTANTE -->
    <div class="fsl" id="fabS" style="display:none"><button class="fab" id="fabB"><i class="fas fa-plus"></i></button></div>

    <!-- MODAL -->
    <div class="mo" id="modal" onclick="if(event.target===this) window.cM()"><div class="mc"><div class="mh"></div><button class="mx" onclick="window.cM()"><i class="fas fa-times"></i></button><div id="mBody"></div></div></div>

    <!-- DRAWER LATERAL -->
    <div class="drawer-overlay" id="drawerOverlay"></div>
    <div class="drawer" id="drawer">
        <div class="drawer-header">
            <div style="display:flex; align-items:center; gap:10px;">
                <div class="av" style="width:40px;height:40px;font-size:18px;background:linear-gradient(135deg,var(--blue),var(--purple));">D</div>
                <div>
                    <div style="font-size:16px;font-weight:800;color:var(--text);">D.Fabrik</div>
                    <div style="font-size:10px;color:var(--text-dim);">v1.0.0</div>
                </div>
            </div>
            <button class="tb" id="drawerClose" style="background:transparent;color:var(--text-dim);"><i class="fas fa-times"></i></button>
        </div>
        <div class="drawer-body">
            <div class="drawer-item" data-view="dashboard"><i class="fas fa-house"></i> Inicio</div>
            <div class="drawer-item" data-view="inventario"><i class="fas fa-boxes-stacked"></i> Inventario</div>
            <div class="drawer-item" data-view="ordenes"><i class="fas fa-clipboard-list"></i> Órdenes</div>
            <div class="drawer-item" data-view="finanzas"><i class="fas fa-chart-line"></i> Finanzas</div>
            <div class="drawer-item" data-view="garantias"><i class="fas fa-shield-alt"></i> Garantías</div>
            <div class="drawer-divider"></div>
            <div class="drawer-item" data-view="configuracion" style="color:var(--amber);"><i class="fas fa-cog"></i> Ajustes Generales</div>
        </div>
    </div>

    <!-- NAVEGACIÓN INFERIOR -->
    <nav class="bn">
        <button class="nb active" data-t="dashboard"><i class="fas fa-house"></i><span>Inicio</span></button>
        <button class="nb" data-t="inventario"><i class="fas fa-boxes-stacked"></i><span>Inventario</span></button>
        <button class="nb" data-t="ordenes"><i class="fas fa-clipboard-list"></i><span>Órdenes</span><span class="nbg" id="oBdg">8</span></button>
        <button class="nb" data-t="finanzas"><i class="fas fa-chart-line"></i><span>Finanzas</span></button>
        <button class="nb" data-t="garantias"><i class="fas fa-shield-alt"></i><span>Garantías</span><span class="nbg" id="gBdg">6</span></button>
    </nav>

    <!-- TOAST -->
    <div class="toast" id="toast"></div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
